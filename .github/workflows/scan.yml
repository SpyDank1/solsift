name: Scan and deploy

on:
  schedule:
    # Every 15 minutes, offset from the top of the hour (GitHub delays or drops on-the-hour schedules under load).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]

permissions:
  contents: write # push scan state to the `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Scan state (tracked tokens, pending outcomes, training samples, paper portfolio) lives on an
      # orphan `data` branch that is overwritten each run, so the repository does not grow without bound.
      - name: Restore previous scan state
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
            echo "Restored state: $(ls data | tr '\n' ' ')"
          else
            echo "No previous state - first run."
          fi

      - name: Unit tests
        run: npm test

      - name: Scan
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }} # optional
        run: node scanner/index.js

      - name: Save scan state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init -q -b data
          git config user.name "solsift-bot"
          git config user.email "solsift-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          rm -rf .git

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/tokens.json data/trends.json data/model.json data/paper.json _site/data/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
